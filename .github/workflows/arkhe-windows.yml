name: Arkhe Destek - Windows Build

# Arkhe Ajans markali RustDesk istemcisi (yalnizca Windows x86_64).
# Sunucu + public key libs/hbb_common (Arkhe34/hbb_common fork) icine gomulu.
# flutter-build.yml icinde Windows disi tum job'lar ve MSI adimlari devre disi.
# Elle tetiklenir: Actions -> "Arkhe Destek - Windows Build" -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: "Ciktilarin yuklenecegi prerelease etiketi"
        required: false
        default: "arkhe-windows"

# flutter-build.yml icindeki job'lar (kapali olanlar dahil) baslangicta dogrulanir;
# generate-sbom 'contents: write' istedigi ve Windows job'unun "Publish Release"
# adimi prerelease olusturdugu icin caller'a bu izin veriliyor.
permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload-tag }}
